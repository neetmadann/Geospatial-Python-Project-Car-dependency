name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Optional: if your site files are in a 'docs' folder, copy them to root
      # - run: cp -r docs/* .

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload static site files
        uses: actions/upload-pages-artifact@v2
        with:
          path: .  # This means upload everything in the current directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
